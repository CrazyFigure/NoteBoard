<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <!-- 桌面图标保留画板与笔的轮廓；仅外部透明，画板和笔身必须有实色底。 -->
  <defs>
    <linearGradient id="frame" x1="35" y1="20" x2="205" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12c5d5"/>
      <stop offset=".48" stop-color="#308cff"/>
      <stop offset="1" stop-color="#8b35ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="88" y1="205" x2="173" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#308cff"/>
      <stop offset="1" stop-color="#853dff"/>
    </linearGradient>
  </defs>
  <!-- 支脚先绘制，避免边框与支脚的交接处露出背景。 -->
  <path d="m66 220-6 19m117-19 6 19" fill="none" stroke="url(#frame)" stroke-width="13" stroke-linecap="round"/>
  <rect x="29" y="16" width="181" height="208" rx="31" fill="#fff" stroke="url(#frame)" stroke-width="12"/>
  <!-- 折角的白色区域属于纸面，不能跟随图标外部一起抠空。 -->
  <path d="M35 77 85 22v34q0 21-21 21H51q-16 0-16 15Z" fill="#1dc2d6"/>
  <path d="M35 77V47q0-25 25-25h25Z" fill="#fff"/>
  <path d="M61 101h64m-64 23h64m-64 23h32" fill="none" stroke="#3d4b63" stroke-width="6" stroke-linecap="round"/>
  <path d="M91 199c12-18 27-36 37-36 17 0-10 28-2 29 6 2 15-13 19-10 5 11 14-1 25-13" fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 白色隔离边让笔在画板边框和深色桌面上都能保持独立轮廓。 -->
  <path d="m169 169 11-29 49-64c5-7 12-8 17-4 6 4 7 10 2 17l-49 65Z" fill="#3d4b63" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <path d="m182 141 40-52 15 11-40 52Z" fill="#fff"/>
  <path d="m197 152 40-52 4 3-42 51-30 15Z" fill="#cdd3dd"/>
  <path d="m182 141 15 11-28 17Z" fill="#3d4b63"/>
  <path d="m225 82 13 10" fill="none" stroke="#fff" stroke-width="5"/>
</svg>
