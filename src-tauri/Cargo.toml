[package]
name = "noteboard"
version = "0.7.9"
description = "Windows 桌面笔记 + 画板软件"
authors = ["CrazyFigure"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "noteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
tempfile = "3"
dunce = "1"
log = "0.4"
url = "2"
# 暂存文件名使用本地可读时间，便于用户按关闭时间定位副本。
chrono = "0.4"
# 更新检查与安装包下载：启用 system-proxy 读取系统代理，rustls-tls 避免 Windows 编译时对 OpenSSL 的依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "stream"] }
# 字体资源包使用 SHA-256 固定清单校验，拒绝被替换或损坏的远程资产。
sha2 = "0.10"
# 官方插件安装跨窗口串行执行，锁等待不占用界面线程。
tokio = { version = "1", features = ["sync"] }
# 字体包安装过程使用随机临时目录，避免多窗口同时触发操作时互相覆盖。
uuid = { version = "1", features = ["v4"] }
# 字体资源包使用标准 ZIP 分发；只启用 Deflate 解压，避免引入无关压缩算法。
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 多端同步：GitHub/GitLab/Gitee 文件内容与 WebDAV Basic 认证使用 Base64 编码。
base64 = "0.22"
# 多端同步：S3 签名摘要输出、WebDAV/GitLab 路径分段编码。
hex = "0.4"
percent-encoding = "2"
# 文档历史记录：版本正文 gzip 压缩存储（与 zip 共用 zlib-rs 后端，不新增依赖树）
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# 本地文件搜索：以下均为依赖树中已有的库（文件监听、线程通道、快速子串查找、快照校验、整数哈希表），不新增下载
notify = "8"
crossbeam-channel = "0.5"
memchr = "2"
crc32fast = "1"
rustc-hash = "2"

# 桌面专属依赖：单实例、窗口状态记忆、系统回收站、font-kit 字体枚举均无 Android 后端
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2"
# 全局唤起窗口快捷键（由 Rust 侧按设置注册，前端不直接调用插件）
tauri-plugin-global-shortcut = "~2.3"
trash = "5"
font-kit = "0.14"
# 复制图片到剪贴板：原生端直接解码本地图片（4K JPEG 约 30 毫秒），避免经 IPC 传输数十 MB 像素
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

# macOS / Linux 的图片位图与文件列表写入系统剪贴板（NSImage/NSURL、image/png 与 text/uri-list）。
# Windows 不用它：其写图时在剪贴板打开期间编码 PNG（大图数秒），且以空所有者打开会写入失败，改为 clipboard/win.rs 原生实现。
[target.'cfg(not(any(target_os = "android", target_os = "ios", windows)))'.dependencies]
arboard = "3.6"
# 本地文件搜索：后台索引线程降低优先级（Linux nice / macOS QoS）
libc = "0.2"

# 标签跨窗口使用系统拖放；Linux 单独使用 GTK 事件串行号，兼容 Wayland。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = { path = "vendor/drag" }

[target."cfg(windows)".dependencies]
# 复用依赖树已有版本，原生恢复旧安装器留下的文件关联；不启动 PowerShell 或修改 UserChoice。
winreg = "0.55"
# Win32_Graphics_Gdi：S06 起系统字体枚举使用 GDI EnumFontFamiliesExW 原生实现（替代 PowerShell 子进程）
# Win32_Security_Cryptography：同步与备份的密码/令牌使用 DPAPI 绑定当前 Windows 用户加密保存
# Win32_System_DataExchange / Win32_System_Memory：图片与文件写入系统剪贴板（clipboard/win.rs）
# Win32_Storage_FileSystem：本地文件搜索列出可添加的磁盘（盘符、类型与卷标）
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
# Markdown 导出 PDF：直接调用 WebView2 PrintToPdf，版本须与 tauri/wry 使用的保持一致
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK 页面进程退出后自动重载（web-process-terminated 信号），版本须与 tauri/wry 使用的保持一致
webkit2gtk = { version = "2.0", features = ["v2_20"] }
# 与 Tauri 使用同一 GTK 3 版本；原生标签拖放从 WebView 的真实鼠标事件发起。
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dev-dependencies]
# 与 Tauri 当前锁定的 Tao 版本共用依赖，回归 OLE 嵌套循环中的实时事件投递。
tao = { version = "0.35", default-features = false, features = ["rwh_06"] }

# 调试构建（tauri dev）中，复制图片用到的解码 / 压缩依赖按发布级别优化：
# 未优化时 4K JPEG 解码约 1.7 秒、PNG 约 0.5 秒，优化后与发布版一致（几十毫秒）。
# 只影响下列依赖（首次编译一次），主工程仍按调试级别快速增量编译。
[profile.dev.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
gif = { opt-level = 3 }
weezl = { opt-level = 3 }
image-webp = { opt-level = 3 }
moxcms = { opt-level = 3 }
pxfm = { opt-level = 3 }
crc32fast = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
adler2 = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
flate2 = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
