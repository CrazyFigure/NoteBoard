[package]
name = "noteboard"
version = "0.1.8"
description = "Windows 桌面笔记 + 画板软件"
authors = ["CrazyFigure"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "noteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
trash = "5"
tempfile = "3"
dunce = "1"
font-kit = "0.14"
log = "0.4"
url = "2"
# 暂存文件名使用本地可读时间，便于用户按关闭时间定位副本。
chrono = "0.4"
# 更新检查与安装包下载：启用 system-proxy 读取系统代理，rustls-tls 避免 Windows 编译时对 OpenSSL 的依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "stream"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
