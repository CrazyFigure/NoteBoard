name: macOS and Linux packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # 每个平台在对应系统上构建，避免在 Windows 伪造不可运行的 macOS / Linux 安装包。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Ubuntu 22.04 是 WebKitGTK 4.1 的较低支持基线；AppImage 在此环境产出。
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libfontconfig1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build package
        env:
          # 未配置 Apple 开发者证书时使用 ad-hoc 签名，不宣称已通过 Apple 公证。
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: NoteBoard-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # 标签发布时等待原有 Windows 工作流创建 Release，再添加 Unix 安装包。
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec gh release upload "$RELEASE_TAG" {} --clobber \;

  # 两种 Mac 安装包上传完成后立即唤起现有 Tap 更新流程，沿用下载校验和安装验证。
  # 直接衔接标签工作流，不依赖机器人创建 Release 后不会继续触发的 release 事件。
  publish-homebrew:
    name: Trigger Homebrew update
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch Tap updater
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '请配置 PACKAGE_PUBLISH_TOKEN，以允许触发 CrazyFigure/homebrew-tap 更新。' >&2
            exit 1
          fi
          # Tap 只跟进三段正式版本，并以最新正式 Release 为准，避免旧标签导致降级。
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "不支持的软件源版本：$RELEASE_TAG" >&2
            exit 1
          fi
          gh workflow run update.yml --repo CrazyFigure/homebrew-tap --ref main
          echo '[Homebrew 更新已触发](https://github.com/CrazyFigure/homebrew-tap/actions/workflows/update.yml)，校验通过后自动更新 Cask。' >> "$GITHUB_STEP_SUMMARY"
