name: macOS and Linux packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # 每个平台在对应系统上构建，避免在 Windows 伪造不可运行的 macOS / Linux 安装包。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Ubuntu 22.04 是 WebKitGTK 4.1 的较低支持基线；AppImage 在此环境产出。
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libfontconfig1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build package
        env:
          # 未配置 Apple 开发者证书时使用 ad-hoc 签名，不宣称已通过 Apple 公证。
          APPLE_SIGNING_IDENTITY: '-'
          NO_STRIP: 'true'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: NoteBoard-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      # 标签发布时等待原有 Windows 工作流创建 Release，再添加 Unix 安装包。
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then break; fi
            sleep 20
          done
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec gh release upload "$RELEASE_TAG" {} --clobber \;
