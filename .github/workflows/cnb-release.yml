name: Sync release to CNB

# 把 GitHub Release（应用版本、plugins、fonts-v*）的说明与附件同步到 CNB 镜像，供「腾讯云 CNB」更新渠道下载。
# 由各发布工作流在上传附件后调用；已同步且哈希一致的附件会跳过，可安全重复运行。
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（如 v0.7.2、plugins、fonts-v1.0.0）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Upload release assets to CNB
    if: github.repository == 'CrazyFigure/NoteBoard'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 同一 Release 的多次同步串行执行，避免重复上传同名附件
    concurrency:
      group: cnb-release-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isPrerelease,isDraft > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release-assets" --clobber

      - name: Upload to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          node scripts/sync-cnb-release.mjs \
            --release-json "$RUNNER_TEMP/release.json" \
            --assets-dir "$RUNNER_TEMP/release-assets"
