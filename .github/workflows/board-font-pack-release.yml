name: Board Font Pack Release

# 画板手写字体包（小赖）：从锁定版本的 @excalidraw/excalidraw 取出分片制包，发布为预发布 Release。
# 版本号与 scripts/build-board-font-pack.mjs 的 BOARD_FONT_PACK_VERSION、src-tauri/src/board_font_pack.rs 的下载地址保持一致。
on:
  push:
    tags:
      - 'fonts-board-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing fonts-board-v* tag to publish'
        required: true
        default: 'fonts-board-v1.0.0'

permissions:
  contents: write

jobs:
  publish-board-font-pack:
    name: Publish board font pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verified board font pack
        id: package
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          version="${tag#fonts-board-v}"
          # 清单必须与锁定的 Excalidraw 一致，且 tag 版本与脚本内版本相同
          node scripts/build-board-font-pack.mjs --check
          node -e "import('./scripts/build-board-font-pack.mjs').then(m => { if (m.BOARD_FONT_PACK_VERSION !== process.argv[1]) { console.error('tag 版本与 BOARD_FONT_PACK_VERSION 不一致'); process.exit(1); } })" "$version"
          node scripts/build-board-font-pack.mjs --zip "$RUNNER_TEMP/board-font-pack"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_path=$RUNNER_TEMP/board-font-pack/NoteBoard-fontpack-board-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.package.outputs.tag }}'
          asset='${{ steps.package.outputs.asset_path }}'
          # 字体 Release 标记为 prerelease，应用更新检查会自动忽略
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --prerelease --title "NoteBoard Board Font Pack $tag" --notes "NoteBoard 画板手写字体包（小赖），在「设置 → 插件 → 字体」中下载；不会安装到系统。"
          fi

  # 发布后同步到腾讯云 CNB 镜像
  sync-cnb:
    needs: publish-board-font-pack
    permissions:
      contents: read
    uses: ./.github/workflows/cnb-release.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit
