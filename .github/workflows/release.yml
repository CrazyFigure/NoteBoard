name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_only:
        description: '仅构建安卓 APK（验证用，不创建 Release）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    # 手动触发且勾选"仅构建安卓"时跳过
    if: ${{ !inputs.android_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 读取完整 tag 历史以对比上一 tag 生成更新日志
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          # 优先使用人工整理的 tag 附注（去掉首行标题）：同版本自修复、Merge 等提交不应出现在更新日志中
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            # checkout 可能把附注标签覆盖为轻量标签，强制重新拉取远端标签对象
            git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}" 2>$null
            if ((git cat-file -t "refs/tags/${env:GITHUB_REF_NAME}" 2>$null) -eq 'tag') {
              $annotation = (git tag -l $env:GITHUB_REF_NAME --format='%(contents:body)' | Out-String).Trim()
              if ($annotation) {
                'body<<__NOTEBOARD_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                $annotation | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                '__NOTEBOARD_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                exit 0
              }
            }
          }

          # 无附注时统计当前 tag 相对上一 tag 的提交生成分类更新日志
          $previousTag = ''
          $previousTagOutput = git describe --tags --abbrev=0 "HEAD^" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $previousTag = $previousTagOutput
          }

          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          $subjects = git log --format=%s $range

          $groups = [ordered]@{
            '新增' = [System.Collections.Generic.List[string]]::new()
            '修复' = [System.Collections.Generic.List[string]]::new()
            '优化' = [System.Collections.Generic.List[string]]::new()
          }

          foreach ($subject in $subjects) {
            # 过滤发布流程整理提交
            if ($subject -match '^(docs|chore)\(release\):') {
              continue
            }

            $text = $subject -replace '^(feat|fix|docs|refactor|perf|style|chore|test|build|ci)(\([^)]+\))?:\s*', ''
            if ([string]::IsNullOrWhiteSpace($text)) {
              $text = $subject
            }

            if ($subject -match '^feat(\([^)]+\))?:') {
              $groups['新增'].Add($text)
            } elseif ($subject -match '^fix(\([^)]+\))?:') {
              $groups['修复'].Add($text)
            } else {
              $groups['优化'].Add($text)
            }
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($heading in $groups.Keys) {
            $lines.Add("${heading}：")
            if ($groups[$heading].Count -gt 0) {
              foreach ($item in $groups[$heading]) {
                $lines.Add("- $item")
              }
            } else {
              $lines.Add("- 本次暂无${heading}项。")
            }
            $lines.Add('')
          }

          $body = ($lines -join [Environment]::NewLine).TrimEnd()
          'body<<__NOTEBOARD_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          '__NOTEBOARD_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 使用 tauri-action 构建 Windows NSIS 安装包并发布到 Release
      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NoteBoard ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 规范产物文件命名
          assetNamePattern: NoteBoard_[version]_[platform]_[arch][setup][ext]

  # 正式标签的 Windows 安装包上传后，以仓库拥有者的跨仓库令牌提交 WinGet 更新申请。
  # 与 APK 构建并行；预发布和仅验证安卓的手动运行不向官方软件源提交。
  publish-winget:
    name: Submit WinGet update
    runs-on: windows-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Setup .NET for WinGet Create
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Submit released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # 令牌经环境变量交给 WinGet Create，避免出现在命令行参数中。
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw '请配置 PACKAGE_PUBLISH_TOKEN，以允许向 microsoft/winget-pkgs 提交更新。'
          }
          # 仅接受三段正式版本号，并从已发布的附件读取实际下载地址。
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "不支持的软件源版本：$env:RELEASE_TAG"
          }
          $version = $Matches[1]
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '读取 Release 失败。' }
          if ($release.isDraft -or $release.isPrerelease) { throw '软件源只接收正式 Release。' }
          $asset = @($release.assets | Where-Object { $_.name -eq "NoteBoard_${version}_windows_x64-setup.exe" })
          if ($asset.Count -ne 1) { throw '未找到唯一的 Windows x64 安装包。' }

          # 重跑工作流时，已有入库版本或同版本待审申请均直接复用，避免重复提交。
          $manifestPath = "manifests/c/CrazyFigure/NoteBoard/$version"
          gh api "repos/microsoft/winget-pkgs/contents/$manifestPath" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            "WinGet $version 已入库。" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $requests = @(gh pr list --repo microsoft/winget-pkgs --state open --author $env:GITHUB_REPOSITORY_OWNER --search "CrazyFigure.NoteBoard $version in:title" --json url | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw '检查现有 WinGet 更新申请失败。' }
          if ($requests.Count -gt 0) {
            $requests.url | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          # 固定官方工具版本并验证发布摘要，更新时保留已收录的安装范围及多语言元数据。
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') {
            throw 'WinGet Create 校验失败。'
          }
          & $tool update CrazyFigure.NoteBoard --version $version --urls "$($asset[0].url)|x64" --release-notes-url "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" --submit --no-open
          if ($LASTEXITCODE -ne 0) { throw '提交 WinGet 更新失败。' }
          "WinGet $version 已提交，审核合并后进入官方软件源。" | Out-File $env:GITHUB_STEP_SUMMARY -Append

  # 安卓 APK（arm64）：Release 由 Windows 任务创建，完成后上传 APK 附件到同一 Release
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-windows
    # Windows 任务成功（正常发布）或被跳过（仅构建安卓）时执行
    if: ${{ !cancelled() && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') }}

    env:
      NDK_VERSION: 27.0.12077973

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Android Gradle 插件要求 JDK 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 只安装实际需要的包：默认的 "tools" 包已从 SDK 仓库移除，按默认值安装会失败
      # NDK 单独安装（见下一步），以便下载中断时重试
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # NDK 压缩包约 700 MB，下载偶发中断（解压报 "Error on ZipFile unknown archive"）；
      # 失败时清理残缺目录与临时下载后重试，运行器镜像已预装该版本时直接跳过
      - name: Install Android NDK
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          for attempt in 1 2 3; do
            if [ -f "${NDK_DIR}/source.properties" ]; then break; fi
            echo "安装 NDK ${NDK_VERSION}（第 ${attempt} 次）"
            sdkmanager --install "ndk;${NDK_VERSION}" && break
            echo "::warning title=NDK 安装::第 ${attempt} 次安装失败，清理后重试"
            rm -rf "${NDK_DIR}" "${ANDROID_HOME}/.temp"
            sleep 20
          done
          test -f "${NDK_DIR}/source.properties"

      - name: Configure Android NDK
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME}/ndk/${NDK_VERSION}" > /dev/null

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 安卓工程不入库：每次由 Tauri 生成，再注入原生桥接、权限、Intent 与签名配置
      - name: Generate Android project
        run: |
          pnpm tauri android init --ci
          # 用安卓专用源图生成启动图标（插画已缩进自适应图标安全区；仅影响 CI 工作区，不改动仓库中的桌面图标）
          pnpm tauri icon src-tauri/icons/icon-android.png
          node scripts/patch-android.mjs

      # 配置了签名 Secrets 时使用正式签名；否则 release 退化为 debug 签名（仍可安装，但升级需卸载重装）
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning title=安卓签名::未配置 ANDROID_KEYSTORE_BASE64，APK 使用 debug 签名"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD}}"
          } > keystore.properties

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SOURCE=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | grep -i release | head -n 1)
          if [ -z "${SOURCE}" ]; then
            echo "未找到 APK 产物" >&2
            find src-tauri/gen/android/app/build/outputs -type f >&2 || true
            exit 1
          fi
          TARGET="NoteBoard_${VERSION}_android_arm64.apk"
          cp "${SOURCE}" "${TARGET}"
          echo "path=${TARGET}" >> "$GITHUB_OUTPUT"

      # 手动触发时也能从 Actions 页面下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # 标签发布：上传到 Windows 任务创建的同一 Release
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber
