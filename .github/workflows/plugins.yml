name: Official plugins

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install plugin build tools
        run: npm install -g pnpm@12.11.2
      - name: Build independently versioned packages
        working-directory: plugins
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Preserve published versions and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node plugins/publish.mjs

  # 插件包与目录上传后同步到腾讯云 CNB 镜像，目录变化时覆盖 CNB 上的旧目录
  sync-cnb:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/cnb-release.yml
    with:
      tag: plugins
    secrets: inherit
