name: Star History

on:
  # 定时刷新仓库内静态 SVG，避免 README 依赖第三方实时图片服务。
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支只允许一个快照任务写入历史文件，避免并发运行互相覆盖观测记录。
concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-star-history:
    name: Update star history SVG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # v5 使用 Node.js 24，避免 GitHub 强制替换已弃用的 Node.js 20 运行时。
        uses: actions/checkout@v5

      - name: Setup Node.js
        # v5 与 Node.js 24 配套，消除旧版 Action 的运行时弃用警告。
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Record star count and generate SVG
        run: node scripts/generate-star-history.mjs
        env:
          # 自定义 PAT 仅作为首选凭据，过期后由脚本自动尝试 Actions 自带令牌。
          STAR_HISTORY_TOKEN: ${{ secrets.PAT_STAR_HISTORY }}
          # github.token 始终保留为独立兜底，不能再被自定义 PAT 覆盖。
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated snapshot and SVG
        shell: bash
        run: |
          # JSON 保存原始观测，SVG 只负责展示；两者必须在同一次提交中保持一致。
          if git diff --quiet -- assets/star-history.json assets/star-history.svg; then
            echo "Star history snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history.svg
          git commit -m "docs: update star history"
          git push
